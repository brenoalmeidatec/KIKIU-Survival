<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Árvore de agentes – KIKIU</title>
<script>try{var __t=localStorage.getItem("painel-tema");if(__t==="light"||__t==="dark")document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<style>
:root{
 --bg:#080c12;--bg2:#0d131c;--panel:#0f161f;--card:#0e151e;--line:#243142;--tx:#e8eef6;--dim:#8796a9;--faint:#4b5b70;
 --haiku:#34e0a1;--sonnet:#4da3ff;--opus:#b784ff;
 --c-tarefa:#4da3ff;--c-leitura:#34e0a1;--c-pergunta:#b784ff;--c-resposta:#b784ff;--c-escrita:#ff9a3c;--c-resultado:#ffd23f;
 --warn:#ffb020;--bad:#ff5d6c;--ok:#34e0a1;--hl:#ffb84d;
 --grid:rgba(120,150,190,.07);
 --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,Menlo,monospace;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{
 --bg:#eef2f8;--bg2:#e4eaf3;--panel:#ffffff;--card:#ffffff;--line:#c5d0df;--tx:#101826;--dim:#566478;--faint:#98a6ba;
 --haiku:#0c9f6c;--sonnet:#1a73e8;--opus:#8a4fe0;
 --c-tarefa:#1a73e8;--c-leitura:#0c9f6c;--c-pergunta:#8a4fe0;--c-resposta:#8a4fe0;--c-escrita:#e06d00;--c-resultado:#c99600;
 --warn:#c47a00;--bad:#d62839;--ok:#0c9f6c;--hl:#d9810a;--grid:rgba(40,70,110,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);min-width:900px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1100px 500px at 50% -10%,rgba(77,163,255,.10),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1900px;margin:0 auto;padding:14px 18px 40px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 88%,transparent)}
header h1{margin:0;font:700 15px var(--mono);letter-spacing:.14em;text-transform:uppercase}
header h1 small{display:block;font:500 12px var(--sans);letter-spacing:0;text-transform:none;color:var(--dim);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:var(--bg2);cursor:default}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.lg u{width:18px;height:0;border-top:2.5px solid var(--c);display:inline-block}
.lg u.d{border-top-style:dashed}
.lsep{width:1px;height:18px;background:var(--line)}
.hr{display:flex;align-items:center;gap:10px}
#live{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--mono);padding:4px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
#live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
#live.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
#live.on i{background:var(--ok);animation:blip 1.4s infinite}
#live.off{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
#live.off i{background:var(--warn)}
@keyframes blip{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
#tema{font:600 12px var(--mono);cursor:pointer;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
#tema:hover{border-color:var(--sonnet)}

#sum{margin:12px 0 8px;padding:11px 16px;border-radius:12px;font-size:15px;border:1px solid color-mix(in srgb,var(--sonnet) 45%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--sonnet) 14%,var(--panel)),var(--panel));position:relative;overflow:hidden}
#sum::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sonnet);box-shadow:0 0 14px var(--sonnet)}
#sum b{font-weight:700}
#trail{display:flex;align-items:center;margin:0 0 12px;overflow-x:auto;padding:4px 2px}
.et{display:flex;align-items:center;flex:0 0 auto}
.et .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--mono);border:2px solid var(--faint);color:var(--dim);background:var(--bg2);flex:0 0 auto}
.et .nm{margin:0 8px 0 7px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.et .ln{width:30px;height:2px;background:var(--line);margin-right:8px;flex:0 0 auto;border-radius:2px}
.et.feita .dot{border-color:var(--ok);color:var(--bg);background:var(--ok)}
.et.feita .nm{color:var(--tx)}
.et.feita .ln{background:var(--ok)}
.et.ativa .dot{border-color:var(--sonnet);color:var(--sonnet);animation:blip2 1.6s infinite}
.et.ativa .nm{color:var(--tx);font-weight:700}
@keyframes blip2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sonnet) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

#main{display:grid;grid-template-columns:268px minmax(0,1fr);gap:14px;align-items:start}
#side{position:sticky;top:10px;display:flex;flex-direction:column;gap:12px}
.box{border:1.5px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);padding:11px 13px}
.box h3{margin:0 0 8px;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#adv{border-color:color-mix(in srgb,var(--opus) 75%,transparent);box-shadow:0 0 26px -12px var(--opus)}
#adv h3{color:var(--opus);display:flex;justify-content:space-between;align-items:center;gap:6px}
#adv .who{font-size:12.5px;color:var(--dim);margin-bottom:6px}
#adv .who b{color:var(--tx)}
#adv .big{font:700 26px var(--mono);color:var(--opus);line-height:1}
#adv .big small{font:500 11px var(--sans);color:var(--dim);margin-left:6px}
#adv ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
#adv li{padding:5px 0 5px 20px;border-top:1px dashed var(--line);position:relative}
#adv li::before{content:attr(data-a);position:absolute;left:0;top:5px;font:700 12px var(--mono);color:var(--opus)}
#adv li.q::before{color:var(--sonnet)}
#adv li time{display:block;font:11px var(--mono);color:var(--faint)}
.empty{color:var(--faint);font-size:12.5px}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cnt div{border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--bg2)}
.cnt b{display:block;font:700 22px var(--mono);line-height:1.1}
.cnt span{font-size:11.5px;color:var(--dim)}
#fatos .f{padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px}
#fatos .f:first-child{border-top:0}
#fatos .f span{display:block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#fatos .f.chg{animation:chg 2s}
@keyframes chg{0%{background:color-mix(in srgb,var(--hl) 35%,transparent)}100%{background:transparent}}

#gbox{border:1.5px dashed var(--line);border-radius:14px;background:color-mix(in srgb,var(--bg2) 55%,transparent);overflow-x:auto;overflow-y:hidden;min-width:0}
#g{position:relative;min-height:420px;min-width:760px}
svg.layer{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#sb{z-index:1}#sf{z-index:5}
#cf{position:absolute;left:0;top:0;z-index:8;pointer-events:none}
.ph{fill:none;stroke-linecap:round}
.ph.st{stroke:var(--faint);stroke-width:1.5;stroke-dasharray:5 6}
.ph.hl{stroke:var(--hl);stroke-width:1.4;stroke-dasharray:3 5}
.ph.cm{stroke-width:2.1}
.ph.halo{stroke-width:8;opacity:.14}
.t-tarefa{stroke:var(--c-tarefa);fill:var(--c-tarefa)}.t-leitura{stroke:var(--c-leitura);fill:var(--c-leitura)}.t-pergunta{stroke:var(--c-pergunta);fill:var(--c-pergunta)}
.t-resposta{stroke:var(--c-resposta);fill:var(--c-resposta)}.t-escrita{stroke:var(--c-escrita);fill:var(--c-escrita)}.t-resultado{stroke:var(--c-resultado);fill:var(--c-resultado)}
.ph.t-resposta.cm{stroke-dasharray:8 6}
.ph.cm,.ph.halo,.ph.st,.ph.hl{fill:none}
.lb rect{fill:var(--card);stroke-width:1.2}
.lb text{font:600 10.5px var(--mono);fill:var(--tx);stroke:none}
.pk{stroke:none}

.card{position:absolute;left:0;top:0;z-index:2;will-change:transform;cursor:pointer;outline:none}
.card.open{z-index:6}
.card .in{position:relative;border:1.5px dashed var(--mc);border-radius:11px;background:var(--card);padding:9px 11px 10px;transition:opacity .45s,filter .45s,box-shadow .3s;box-shadow:0 8px 24px -14px var(--mc)}
.card:hover .in,.card:focus-visible .in{box-shadow:0 0 0 1px var(--mc),0 0 28px -4px var(--mc)}
.card.new .in{animation:spawn .65s backwards cubic-bezier(.2,.9,.3,1.25)}
@keyframes spawn{0%{opacity:0;transform:scale(.55);filter:blur(5px)}100%{opacity:1;transform:none;filter:none}}
.card.gone .in{opacity:0;transform:scale(.8);transition:all .4s}
.card.dim .in{opacity:.2;filter:grayscale(.7)}
.card.done:not(.dim) .in{filter:saturate(.7)}
.card.done:not(.dim) .tx{color:var(--dim)}
.card.done:hover .in{filter:none}
.card.done:hover .tx{color:var(--tx)}
.pr{position:absolute;inset:-2px;border-radius:12px;border:2px solid var(--mc);opacity:0;pointer-events:none}
.pr.go{animation:ring .9s ease-out}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.14,1.35)}}
.m-haiku{--mc:var(--haiku)}.m-sonnet{--mc:var(--sonnet)}.m-opus{--mc:var(--opus)}.m-outro{--mc:var(--dim)}
.ag.working .in{box-shadow:0 0 30px -8px var(--mc),0 8px 24px -14px var(--mc)}
.ag.root .in{border-width:2px;padding:12px 14px 13px;background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 13%,var(--card)),var(--card));box-shadow:0 0 44px -10px var(--mc)}
.ag.root .nm{font-size:16px}
.crown{font:700 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mc);margin-bottom:3px}
.crown[hidden]{display:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nm{font:700 12.5px var(--mono);overflow-wrap:anywhere;line-height:1.25}
.mb{font:700 10px var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:5px;color:var(--bg);background:var(--mc);white-space:nowrap;flex:0 0 auto}
.cs{display:flex;align-items:center;gap:8px;margin:6px 0 5px;font:11.5px var(--mono);color:var(--dim)}
.chip{font:700 11.5px var(--mono);color:var(--cc,var(--dim));white-space:nowrap}
.s-trabalhando{--cc:var(--sonnet)}.s-pensando{--cc:var(--opus)}.s-esperando{--cc:var(--warn)}.s-pronto{--cc:var(--ok)}.s-erro{--cc:var(--bad)}.s-info{--cc:var(--dim)}
.cs .el{margin-left:auto;white-space:nowrap}.cs .pc{white-space:nowrap}
.bar{height:5px;border-radius:5px;background:color-mix(in srgb,var(--mc,var(--sonnet)) 16%,var(--bg2));overflow:hidden;position:relative}
.bar b{display:block;height:100%;width:0;background:var(--mc);border-radius:5px;box-shadow:0 0 8px var(--mc)}
.working .bar::after,.thinking .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shim 1.5s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.tx{margin-top:7px;font-size:12.5px;line-height:1.4;color:var(--tx);word-wrap:break-word}
.more{display:none;margin-top:9px;border-top:1px dashed var(--line);padding-top:7px;font-size:11.5px;color:var(--dim)}
.open .more{display:block}
.more h4{margin:6px 0 3px;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mc)}
.more p{margin:2px 0;line-height:1.35}
.more p time{font:10.5px var(--mono);color:var(--faint);margin-right:5px}
.more p.old{opacity:.5}
.no{--mc:var(--nc,#8fa3bd)}
.t-arquivo-c{--nc:#8fa3bd}.t-suspeita-c{--nc:#ffb84d}.t-ferramenta-c{--nc:#4fe3d3}.t-resultado-c{--nc:#ffd23f}.t-dispositivo-c{--nc:#ff7eb6}.t-conceito-c{--nc:#a9b6ff}
.no .in{padding:7px 10px 8px;border-radius:9px}
.no .nm{font-size:12px}
.tp{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mc);border:1px solid color-mix(in srgb,var(--mc) 55%,transparent);padding:1px 6px;border-radius:5px;flex:0 0 auto}
.no .tx{font-size:12px;color:var(--dim);margin-top:4px}
.card.small .in{padding:4px 8px;opacity:.55}
.card.small .tx,.card.small .tp{display:none}
.card.small .nm{font-size:11px}
.hip{--mc:var(--hl)}
.hip.s-confirmada{--mc:var(--ok)}
.hip.s-descartada{--mc:var(--faint)}
.hip .pb{display:flex;align-items:center;gap:8px;margin-top:7px}
.hip .pb .bar{flex:1;height:7px}
.hip .pv{font:700 13px var(--mono);min-width:38px;text-align:right}
.hip.s-descartada .tx{text-decoration:line-through;color:var(--dim)}
.hip.s-descartada .in{filter:grayscale(.8)}
.stamp{position:absolute;right:8px;top:34%;font:800 12px var(--mono);letter-spacing:.14em;padding:3px 9px;border:3px solid;border-radius:6px;transform:rotate(-12deg);pointer-events:none;display:none;background:color-mix(in srgb,var(--card) 75%,transparent)}
.s-descartada .stamp{display:block;color:var(--bad);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) backwards}
.s-confirmada .stamp{display:block;color:var(--ok);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}

#log{margin-top:14px}
#log h3{display:flex;justify-content:space-between}
.lw{max-height:290px;overflow:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
th{position:sticky;top:0;text-align:left;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px dashed var(--line);vertical-align:top}
td.h{color:var(--faint);white-space:nowrap;width:78px}
td.q{white-space:nowrap;width:190px;font-weight:700}
td.q i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--c,var(--dim))}
td.s{white-space:nowrap;width:140px;text-align:right}
td.x{font:13px var(--sans)}
tr.nw td{background:color-mix(in srgb,var(--sonnet) 13%,transparent)}
tr.nw td.h{color:var(--sonnet)}
tr.fresh td{animation:chg 2.4s}

abbr.gl{text-decoration:underline dotted var(--dim);text-underline-offset:3px;cursor:help}
#tip{position:fixed;z-index:50;max-width:290px;padding:8px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--sonnet);color:var(--tx);font:12.5px/1.4 var(--sans);box-shadow:0 8px 30px rgba(0,0,0,.4);display:none;pointer-events:none}
#tip b{display:block;font:700 11px var(--mono);color:var(--sonnet);margin-bottom:2px}

@media (max-width:1180px){#main{grid-template-columns:230px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <h1>Árvore de agentes<small id="ttl">carregando…</small></h1>
 <div class="legend" id="legend"></div>
 <div class="hr"><span id="live" class="off"><i></i><span id="livet">sem sinal</span></span><button id="tema" type="button" title="Trocar entre tema escuro e claro">☾ / ☀</button></div>
</header>
<div id="sum">Conectando ao quadro de status…</div>
<div id="trail"></div>
<div id="main">
 <aside id="side">
  <div class="box" id="adv"></div>
  <div class="box"><h3>Contadores</h3><div class="cnt" id="cnt"></div></div>
  <div class="box" id="fatos"><h3>Fatos do caso</h3><div id="flist"></div></div>
 </aside>
 <section id="gbox">
  <div id="g">
   <svg class="layer" id="sb"></svg>
   <svg class="layer" id="sf"></svg>
   <canvas id="cf"></canvas>
  </div>
 </section>
</div>
<section class="box" id="log"><h3><span>Diário ao vivo</span><span id="logn" style="font-weight:500;letter-spacing:0"></span></h3>
 <div class="lw"><table><thead><tr><th>Hora</th><th>Quem</th><th>O que aconteceu</th><th style="text-align:right">Estado</th></tr></thead><tbody id="lb"></tbody></table></div>
</section>
</div>
<div id="tip"></div>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var RM=false;try{RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?"":s)}
function html(s){return esc(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+"h "+m+"min":m?m+"min "+String(s).padStart(2,"0")+"s":s+"s"}
function hms(t){var d=new Date(t*1000),p=function(n){return String(n).padStart(2,"0")};return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
function nowS(){return Date.now()/1000}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function trunc(s,n){s=esc(s);return s.length>n?s.slice(0,n-1)+"…":s}
function hashS(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
var SVGNS="http://www.w3.org/2000/svg";
function sv(tag,cls,parent){var e=document.createElementNS(SVGNS,tag);if(cls)e.setAttribute("class",cls);if(parent)parent.appendChild(e);return e}

/* ---------- glossário (palavras difíceis em linguagem simples) ---------- */
var GLOS=[
 {re:/data abort/ig,k:"Data abort",d:"O processador tentou ler ou escrever num lugar da memória onde não podia. É o jeito do Vita dizer: \"travei\"."},
 {re:/ponteiro nulo|acesso a ponteiro nulo|null pointer|nullptr/ig,k:"Ponteiro nulo",d:"Uma \"setinha\" que deveria apontar para algo, mas aponta para o nada. Usar isso derruba o programa."},
 {re:/ponteiros?/ig,k:"Ponteiro",d:"Um endereço que diz onde algo está guardado na memória."},
 {re:/dumps?/ig,k:"Dump",d:"Um \"retrato\" do programa no instante em que ele caiu, com tudo que estava acontecendo."},
 {re:/heap/ig,k:"Heap",d:"A área de memória onde o jogo guarda o que ele cria enquanto roda."},
 {re:/threads?/ig,k:"Thread",d:"Uma \"linha de trabalho\" do programa. A principal cuida do jogo em si."},
 {re:/crash(es)?/ig,k:"Crash",d:"Quando o programa fecha sozinho por causa de um erro."},
 {re:/NO_NETWORK/g,k:"NO_NETWORK",d:"Um modo em que o jogo é montado sem internet. Se ele tentar usar rede mesmo assim, pode dar problema."},
 {re:/DynamicFont/g,k:"DynamicFont",d:"Um tipo de fonte (letra) do Godot desenhada na hora. O Godot 3 não entende todos os recursos dela."},
 {re:/call_ptr/g,k:"call_ptr",d:"Parte do motor que chama as funções de um objeto. Quebra se o objeto já não existe."},
 {re:/Variant/g,k:"Variant",d:"Uma \"caixinha\" do Godot que guarda qualquer tipo de valor (número, texto, objeto...)."},
 {re:/\bGodot\b/g,k:"Godot",d:"O motor (programa base) com que o jogo é feito."},
 {re:/\bmotor\b/ig,k:"Motor",d:"O programa base que faz o jogo funcionar (aqui, o Godot)."},
 {re:/n[óo]s? j[áa] liberados?|liberado/ig,k:"Nó liberado",d:"Uma peça do jogo que já foi apagada da memória, mas alguém ainda tenta usar."},
 {re:/\btemplate\b/ig,k:"Template",d:"A versão pré-montada do motor que empacota o jogo para rodar no Vita."},
 {re:/recompilad[oa]/ig,k:"Recompilado",d:"Montado de novo a partir do código-fonte, o que pode mudar o comportamento."},

   else{p8[2]=pa[0]+(e.sa==="r"?k:-k);p8[3]=pa[1];p8[4]=pb[0]+(e.sb==="l"?-k:k);p8[5]=pb[1]}
  }

  if(!p.g){p.g=sv("g","t-"+e.tipo,SF);var gl=sv("circle","pk",p.g);gl.setAttribute("r",14);gl.style.opacity=".25";
   for(var k=3;k>=0;k--){var c=sv("circle","pk",p.g);c.setAttribute("r",k===0?5:3.6-k*.6);c.style.opacity=k===0?1:.5-k*.12}
   p.tr=p.g.querySelectorAll("circle")}
  if(u>=1){pingCard(e.b);e.flash=1;p.g.remove();packets.splice(i,1);continue}
  var ease=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,tr=p.tr;
  var pt=bz(e.p,ease);tr[0].setAttribute("cx",pt[0].toFixed(1));tr[0].setAttribute("cy",pt[1].toFixed(1));
  for(var k2=0;k2<4;k2++){var q=bz(e.p,clamp(ease-k2*.035,0,1));tr[4-k2].setAttribute("cx",q[0].toFixed(1));tr[4-k2].setAttribute("cy",q[1].toFixed(1))}

/* ---------- confete ---------- */
function boom(c){

 for(var i=0;i<70;i++){var a=Math.random()*6.283,s=120+Math.random()*320;conf.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-160,r:Math.random()*6.28,vr:(Math.random()-.5)*14,c:cols[i%5],life:1.6+Math.random()*.8,w:5+Math.random()*5,h:3+Math.random()*4})}

var cfDirty=false;
function frameConf(dt){
 if(!conf.length){if(cfDirty){CX.clearRect(0,0,CF.width,CF.height);cfDirty=false}return}

  p.vy+=620*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99;p.r+=p.vr*dt;
  CX.save();CX.globalAlpha=Math.min(1,p.life);CX.translate(p.x,p.y);CX.rotate(p.r);CX.fillStyle=p.c;CX.fillRect(-p.w/2,-p.h/2,p.w,p.h);CX.restore()}

/* ---------- layout automático em camadas ---------- */
function measure(){
 Object.keys(cards).forEach(function(k){var c=cards[k];if(c.gone)return;c.w=cardW(c);c.el.style.width=c.w+"px"});
 Object.keys(cards).forEach(function(k){var c=cards[k];if(c.gone)return;c.h=c.el.offsetHeight||c.h});
}
function layout(){
 measure();
 gw=Math.max(GBOX.clientWidth-2,760);
 var PADX=20,GX=30,GY=34,TIER=74,y=26;
 var list=Object.keys(cards).map(function(k){return cards[k]}).filter(function(c){return !c.gone});
 var ags=list.filter(function(c){return c.kind==="ag"});
 var depth={};
 function dep(id,g){if(depth[id]!==undefined)return depth[id];if(g>12)return 0;var p=model.pai[id];return depth[id]=(p&&model.A[p])?dep(p,g+1)+1:0}
 ags.forEach(function(c){dep(c.id,0)});
 var tiers=[];ags.forEach(function(c){(tiers[depth[c.id]]||(tiers[depth[c.id]]=[])).push(c)});
 var order={},oi=0;
 function rows(arr){
  var rr=[],cur=[],cw=0;
  arr.forEach(function(c){var need=c.w+(cur.length?GX:0);if(cur.length&&cw+need>gw-2*PADX){rr.push(cur);cur=[];cw=0;need=c.w}cur.push(c);cw+=need});
  if(cur.length)rr.push(cur);
  rr.forEach(function(r,ri){var tot=r.reduce(function(s,c){return s+c.w},0)+GX*(r.length-1),x=(gw-tot)/2,rh=0;
   r.forEach(function(c){c.tx=x;c.ty=y;x+=c.w+GX;if(c.h>rh)rh=c.h});y+=rh+(ri<rr.length-1?GY:0)});
 }
 var anyTier=false;
 for(var d=0;d<tiers.length;d++){
  var t=tiers[d];if(!t)continue;
  t.sort(function(a,b){var pa=order[model.pai[a.id]]||0,pb=order[model.pai[b.id]]||0;return pa-pb||((a.a&&a.a.inicio)||0)-((b.a&&b.a.inicio)||0)});
  rows(t);t.forEach(function(c){order[c.id]=++oi});y+=TIER;anyTier=true;

 function bary(c){

  Object.keys(edges).forEach(function(k){var e=edges[k],o=e.a===c.key?e.b:e.b===c.key?e.a:null;if(o&&cards[o]&&cards[o].kind==="ag"){s+=cards[o].tx+cards[o].w/2;n++}});
  return n?s/n:1e9;

 if(CF.width!==gw||CF.height!==gh){CF.width=gw;CF.height=gh}
 list.forEach(function(c){if(!c.placed){c.placed=true;c.x=c.tx;c.y=c.ty;place(c)}});

 for(i=0;i<ks.length;i++){var c=cards[ks[i]],dx=c.tx-c.x,dy=c.ty-c.y;
  if(dx!==0||dy!==0){if(Math.abs(dx)<.15&&Math.abs(dy)<.15){c.x=c.tx;c.y=c.ty}else{c.x+=dx*k;c.y+=dy*k}place(c)}}
 stepBars(RM?1:1-Math.exp(-dt*5));

 if(spinAcc>90){spinAcc=0;spinI++;
  for(i=0;i<ks.length;i++){var c2=cards[ks[i]];if(!c2||c2.kind!=="ag"||c2.gone)continue;
   var s=c2.st,txt=s==="trabalhando"?"["+SPIN[spinI%10]+" trabalhando]":s==="pensando"?"["+THINK[spinI%THINK.length]+"pensando]":"["+(GLYPH[s]||"•")+" "+s+"]";
   if(c2._ct!==txt){c2._ct=txt;(c2.q[".chip"]||(c2.q[".chip"]=c2.el.querySelector(".chip"))).textContent=txt;c2.q[".chip"].className="chip s-"+s}}}
}
function start(){if(!raf&&!document.hidden){lastTs=0;raf=requestAnimationFrame(frame)}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}

/* ---------- recarrega o status.js a cada segundo (sem fetch; funciona em file://) ---------- */
var loadTimer=0;
function load(){
 clearTimeout(loadTimer);
 if(document.hidden)return;
 var s=document.createElement("script");s.charset="utf-8";
 var again=function(){s.remove();loadTimer=setTimeout(load,1000)};
 s.onload=function(){
  var Q=window.PAINEL;
  if(Q&&typeof Q==="object"&&Q!==lastRef&&Q.agentes&&typeof Q.agentes==="object"&&typeof Q.atualizado==="number"){
   lastRef=Q;
   try{P=Q;sync(Q);lastOk=Date.now()}catch(e){if(window.console)console.error(e)}
  }else if(Q&&Q===lastRef)lastOk=Date.now();
  again();
 };
 s.onerror=again;
 s.src="status.js?cache="+Date.now();
 document.head.appendChild(s);
}
document.addEventListener("visibilitychange",function(){if(document.hidden){stop();clearTimeout(loadTimer)}else{start();load()}});
window.addEventListener("resize",function(){layDirty=true});
$("tema").addEventListener("click",function(){
 var r=document.documentElement,cur=r.getAttribute("data-theme");
 if(!cur)cur="dark";
 var nx=cur==="light"?"dark":"light";r.setAttribute("data-theme",nx);lsSet("painel-tema",nx);
});
setInterval(tick,1000);
start();load();
})();
