name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.4.1"
  PROJETO: jogos/hordas/projeto
jobs:
  mudancas:
    # PR que so mexe em texto (.md, docs/, LOGBOOK) nao precisa do Godot: testes, gdlint e gdformat pulam.
    # Fora de PR (workflow_call da Release, workflow_dispatch) roda tudo.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filtro
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "codigo=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qvE '(\.md$|^docs/)'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::So texto mudou: testes do Godot, gdlint e gdformat pulados."
          fi
  testes:
    # 4 shards equilibrados pelo tempo (ferramentas/tempos_testes.txt); o criterio continua no testes_ci.sh.
    name: testes (${{ matrix.shard }}/4)
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Baixar Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
      - name: Cache da importacao (.godot)
        id: cache-import
        uses: actions/cache@v4
        with:
          path: jogos/hordas/projeto/.godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('jogos/hordas/projeto/project.godot', 'jogos/hordas/projeto/**/*.png', 'jogos/hordas/projeto/**/*.ogg', 'jogos/hordas/projeto/**/*.wav', 'jogos/hordas/projeto/**/*.ttf', 'jogos/hordas/projeto/**/*.svg', 'jogos/hordas/projeto/**/*.import') }}
      - name: Importar o projeto (2x sem cache, 1x com cache; segfault no fim e normal)
        env:
          VEZES: ${{ steps.cache-import.outputs.cache-hit == 'true' && '1' || '2' }}
        run: |
          cd "$PROJETO"
          for i in $(seq "$VEZES"); do ~/godot/godot --headless --path . --import || true; done
      - name: Rodar as cenas do shard ${{ matrix.shard }}/4 (4 em paralelo; criterio e relatorio no script)
        run: bash ferramentas/testes_ci.sh ~/godot/godot 4 ${{ matrix.shard }}/4
  ortografia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar hunspell pt_BR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq hunspell hunspell-pt-br
      - run: python3 -I ferramentas/ortografia.py
  python_testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I ferramentas/teste_guarda_save.py
  gdlint:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true   # so aviso: o codigo ainda nao foi formatado (Marco 0)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdlint jogos/hordas/projeto/scripts jogos/hordas/projeto/testes jogos/hordas/projeto/v2 || echo "::warning::gdlint achou problemas de estilo (so aviso ate o codigo ser formatado)"
  gdformat:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: gdformat --check (scripts, testes e v2)
        run: gdformat -l 160 --check jogos/hordas/projeto/scripts jogos/hordas/projeto/testes jogos/hordas/projeto/v2
